name: Release Plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ext: dll
            exe_ext: .exe
            platform: windows-x86_64
          - os: ubuntu-latest
            ext: so
            exe_ext: ""
            platform: linux-x86_64
          - os: macos-latest
            ext: dylib
            exe_ext: ""
            platform: macos-aarch64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libfontconfig1-dev

      # 1. Checkout all three repos side-by-side to satisfy relative Cargo path dependencies
      - name: Checkout opencad-autolisp-and-ide
        uses: actions/checkout@v4
        with:
          path: opencad-autolisp-and-ide

      - name: Checkout opencad-autolisp-engine
        uses: actions/checkout@v4
        with:
          repository: yztink/opencad-autolisp-engine
          path: opencad-autolisp-engine

      - name: Checkout OpenCADStudio
        uses: actions/checkout@v4
        with:
          repository: yztink/OpenCADStudio
          path: OpenCADStudio

      # 2. Setup Rust toolchain
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: opencad-autolisp-and-ide -> target

      # 3. Build release binaries
      - name: Build release binaries
        working-directory: opencad-autolisp-and-ide
        run: cargo build --release

      # 4. Stage release assets into a zip bundle and loose assets
      - name: Stage release package
        shell: bash
        run: |
          mkdir -p bundle
          mkdir -p dist

          # Copy plugin.toml and INSTALL instructions
          cp opencad-autolisp-and-ide/plugin.toml bundle/plugin.toml
          cp opencad-autolisp-and-ide/INSTALL.txt bundle/INSTALL.txt

          # Copy plugin library (named for OpenCAD Studio)
          cp opencad-autolisp-and-ide/target/release/*opencad_autolisp.${{ matrix.ext }} "bundle/opencad.autolisp_and_ide.${{ matrix.ext }}"

          # Copy IDE executable if present
          if [ -f "opencad-autolisp-and-ide/target/release/opencad_autolisp_ide${{ matrix.exe_ext }}" ]; then
            cp "opencad-autolisp-and-ide/target/release/opencad_autolisp_ide${{ matrix.exe_ext }}" "bundle/opencad_autolisp_ide${{ matrix.exe_ext }}"
          fi

          # 1. Create all-in-one ZIP bundle for this platform: <plugin_id>-<platform>.zip
          # OpenCAD Studio's built-in package manager automatically recognizes -<platform>.zip bundles!
          (cd bundle && python -m zipfile -c "../dist/opencad.autolisp_and_ide-${{ matrix.platform }}.zip" *)

          # 2. Also keep loose library and plugin.toml in dist for legacy/direct installer compatibility
          cp "bundle/opencad.autolisp_and_ide.${{ matrix.ext }}" "dist/opencad.autolisp_and_ide-${{ matrix.platform }}.${{ matrix.ext }}"
          cp bundle/plugin.toml dist/plugin.toml

      # 5. Upload all artifacts to the GitHub Release
      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
